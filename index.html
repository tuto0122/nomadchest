<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кыргызский Фольклор</title>
  <style>
    /* Разрешаем нормальный скролл всей странице */
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px 12px;
    }

    header {
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      text-align: center;
    }

    h1 {
      font-size: 1.3rem;
      color: #fbbf24;
      margin-bottom: 8px;
    }

    .status-bar {
      background: #1e293b;
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .phase-text {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .timer-badge {
      background: #ef4444;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 4px 12px;
      border-radius: 16px;
      min-width: 50px;
      text-align: center;
    }

    .timer-badge.memorize {
      background: #2563eb;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 180px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card.selected {
      border-color: #fbbf24;
      background: #2d3f58;
    }

    .card-img-wrapper {
      width: 100%;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
      pointer-events: none; /* Чтобы скролл шел сквозь картинку */
    }

    .card-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-fallback {
      font-size: 2.2rem;
    }

    .card-title {
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.25;
      color: #e2e8f0;
      font-weight: 500;
      pointer-events: none;
    }

    .actions {
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .btn {
      background: #10b981;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      background: #059669;
    }

    /* Модальное окно */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      display: none;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .score-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #fbbf24;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      margin: 16px auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>Кыргызский Фольклор</h1>
    <div class="status-bar">
      <span class="phase-text" id="phase-text">Запомните порядок!</span>
      <div class="timer-badge memorize" id="timer">30</div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <div class="actions">
    <button class="btn" id="action-btn">Запомнил! Перемешать сейчас</button>
  </div>

  <div class="modal" id="result-modal">
    <div class="modal-content">
      <h2>Результат!</h2>
      <div class="score-circle" id="score-text">0/8</div>
      <p id="result-desc" style="margin-bottom: 20px; color: #cbd5e1;"></p>
      <button class="btn" onclick="resetGame()">Попробовать снова</button>
    </div>
  </div>

  <script>
    const INITIAL_CARDS = [
      { id: 1, title: "Бешмант - мантия-невидимка", image: "beshmant.png", fallback: "🧥" },
      { id: 2, title: "Бөрү - волк, умеющий перевоплощаться", image: "boru.png", fallback: "🐺" },
      { id: 3, title: "Чалкуйрук - верный конь Эр Төштүка", image: "chalkuiruk.png", fallback: "🐎" },
      { id: 4, title: "Жайыл дасторкон - скатерть-самобранка", image: "dastorkon.png", fallback: "🍞" },
      { id: 5, title: "Эр Төштүк - герой, совершивший подвиги", image: "ertoshtuk.png", fallback: "⚔️" },
      { id: 6, title: "Көөкөр - сосуд для кымыза", image: "kookor.png", fallback: "🏺" },
      { id: 7, title: "Үркөр - отец, превратившийся в звезды", image: "urkor.png", fallback: "⭐" },
      { id: 8, title: "Ур Токмок - палка, которая бьет владельца", image: "urtoqmoq.png", fallback: "🪄" }
    ];

    let currentCards = [...INITIAL_CARDS];
    let originalOrderIds = INITIAL_CARDS.map(c => c.id);
    let phase = 'memorize'; 
    let timeLeft = 30;
    let timerInterval = null;
    let selectedIndex = null;

    const gridEl = document.getElementById('grid');
    const timerEl = document.getElementById('timer');
    const phaseTextEl = document.getElementById('phase-text');
    const actionBtn = document.getElementById('action-btn');
    const modalEl = document.getElementById('result-modal');

    function init() {
      phase = 'memorize';
      timeLeft = 30;
      selectedIndex = null;
      currentCards = [...INITIAL_CARDS];
      modalEl.classList.remove('show');
      
      timerEl.textContent = timeLeft;
      timerEl.className = 'timer-badge memorize';
      phaseTextEl.textContent = 'Запомните порядок!';
      
      actionBtn.textContent = 'Запомнил! Перемешать сейчас';
      actionBtn.onclick = startReorderPhase;

      renderCards();
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (phase === 'memorize') {
            startReorderPhase();
          } else if (phase === 'reorder') {
            finishGame();
          }
        }
      }, 1000);
    }

    function startReorderPhase() {
      clearInterval(timerInterval);
      phase = 'reorder';
      timeLeft = 60;
      selectedIndex = null;
      
      shuffle(currentCards);

      phaseTextEl.textContent = 'Нажмите на 2 карты, чтобы поменять местами';
      timerEl.textContent = timeLeft;
      timerEl.className = 'timer-badge';
      
      actionBtn.textContent = 'Готово! Проверить';
      actionBtn.onclick = finishGame;

      renderCards();
      startTimer();
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function renderCards() {
      gridEl.innerHTML = '';
      currentCards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = `card ${selectedIndex === index ? 'selected' : ''}`;
        
        cardEl.onclick = () => {
          if (phase !== 'reorder') return;

          if (selectedIndex === null) {
            selectedIndex = index;
          } else if (selectedIndex === index) {
            selectedIndex = null;
          } else {
            const temp = currentCards[selectedIndex];
            currentCards[selectedIndex] = currentCards[index];
            currentCards[index] = temp;
            selectedIndex = null;
          }
          renderCards();
        };

        cardEl.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${card.image}" alt="${card.title}" class="card-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="card-fallback" style="display:none;">${card.fallback}</div>
          </div>
          <div class="card-title">${card.title}</div>
        `;
        
        gridEl.appendChild(cardEl);
      });
    }

    function finishGame() {
      clearInterval(timerInterval);
      phase = 'finished';

      let correctCount = 0;
      currentCards.forEach((card, index) => {
        if (card.id === originalOrderIds[index]) {
          correctCount++;
        }
      });

      document.getElementById('score-text').textContent = `${correctCount} / ${INITIAL_CARDS.length}`;
      
      let desc = '';
      if (correctCount === INITIAL_CARDS.length) {
        desc = 'Феноменальная память! Всё верно!';
      } else if (correctCount >= 5) {
        desc = 'Отличный результат!';
      } else {
        desc = 'Хорошая попытка!';
      }
      
      document.getElementById('result-desc').textContent = desc;
      modalEl.classList.add('show');
    }

    function resetGame() {
      init();
    }

    init();
  </script>
</body>
</html>
