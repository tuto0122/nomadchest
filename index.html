<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интерактивная игра — Кыргызский Фольклор</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.5rem;
      color: #fbbf24;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .status-bar {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .phase-text {
      font-weight: 600;
      font-size: 1rem;
    }

    .timer-badge {
      background: #ef4444;
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 4px 12px;
      border-radius: 20px;
      min-width: 60px;
      text-align: center;
      transition: background 0.3s;
    }

    .timer-badge.memorize {
      background: #3b82f6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }

    @media (min-width: 480px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      aspect-ratio: 3/4;
      cursor: grab;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .card:active {
      cursor: grabbing;
    }

    .card.selected {
      border-color: #fbbf24;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
      transform: scale(1.03);
    }

    .card-img-wrapper {
      width: 100%;
      height: 65%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .card-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-fallback {
      font-size: 2.5rem;
    }

    .card-title {
      font-size: 0.75rem;
      text-align: center;
      line-height: 1.2;
      color: #e2e8f0;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .actions {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
      width: 100%;
      max-width: 300px;
    }

    .btn:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Modal / Results */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      margin: 16px auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>Кыргызский Фольклор</h1>
    <div class="status-bar">
      <span class="phase-text" id="phase-text">Запомните порядок!</span>
      <div class="timer-badge memorize" id="timer">30</div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <div class="actions">
    <button class="btn" id="action-btn" disabled>Запомнил! Перемешать сейчас</button>
  </div>

  <div class="modal" id="result-modal">
    <div class="modal-content">
      <h2>Результат!</h2>
      <div class="score-circle" id="score-text">0/8</div>
      <p id="result-desc" style="margin-bottom: 20px; color: #cbd5e1;"></p>
      <button class="btn" onclick="resetGame()">Попробовать снова</button>
    </div>
  </div>

  <script>
    // Исходный список карточек из вашей задачи
    const INITIAL_CARDS = [
      { id: 1, title: "Бешмант - мантия-невидимка", image: "beshmant.png", fallback: "🧥" },
      { id: 2, title: "Бөрү - волк, умеющий перевоплощаться", image: "boru.png", fallback: "🐺" },
      { id: 3, title: "Чалкуйрук - верный конь Эр Төштүка", image: "chalkuiruk.png", fallback: "🐎" },
      { id: 4, title: "Жайыл дасторкон - скатерть-самобранка", image: "dastorkon.png", fallback: "🍞" },
      { id: 5, title: "Эр Төштүк - герой, совершивший подвиги", image: "ertoshtuk.png", fallback: "⚔️" },
      { id: 6, title: "Көөкөр - сосуд для кымыза", image: "kookor.png", fallback: "🏺" },
      { id: 7, title: "Үркөр - отец, превратившийся в звезды", image: "urkor.png", fallback: "⭐" },
      { id: 8, title: "Ур Токмок - палка, которая бьет владельца", image: "urtoqmoq.png", fallback: "🪄" }
    ];

    let currentCards = [...INITIAL_CARDS];
    let originalOrderIds = INITIAL_CARDS.map(c => c.id);
    let phase = 'memorize'; // 'memorize', 'reorder', 'finished'
    let timeLeft = 30;
    let timerInterval = null;
    let selectedIndex = null;

    const gridEl = document.getElementById('grid');
    const timerEl = document.getElementById('timer');
    const phaseTextEl = document.getElementById('phase-text');
    const actionBtn = document.getElementById('action-btn');
    const modalEl = document.getElementById('result-modal');

    function init() {
      phase = 'memorize';
      timeLeft = 30;
      selectedIndex = null;
      currentCards = [...INITIAL_CARDS];
      modalEl.classList.remove('show');
      
      timerEl.textContent = timeLeft;
      timerEl.className = 'timer-badge memorize';
      phaseTextEl.textContent = 'Запомните порядок!';
      
      actionBtn.disabled = false;
      actionBtn.textContent = 'Запомнил! Перемешать сейчас';
      actionBtn.onclick = startReorderPhase;

      renderCards();
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (phase === 'memorize') {
            startReorderPhase();
          } else if (phase === 'reorder') {
            finishGame();
          }
        }
      }, 1000);
    }

    function startReorderPhase() {
      clearInterval(timerInterval);
      phase = 'reorder';
      timeLeft = 60; // 60 секунд на расстановку карточек
      
      // Перемешиваем карточки
      shuffle(currentCards);

      phaseTextEl.textContent = 'Расставьте карточки по памяти!';
      timerEl.textContent = timeLeft;
      timerEl.className = 'timer-badge';
      
      actionBtn.textContent = 'Готово! Проверить';
      actionBtn.onclick = finishGame;

      renderCards();
      startTimer();
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function renderCards() {
      gridEl.innerHTML = '';
      currentCards.forEach((card, index) => {
        const cardEl = document.createElement('div');
        cardEl.className = `card ${selectedIndex === index ? 'selected' : ''}`;
        
        if (phase === 'reorder') {
          cardEl.onclick = () => handleCardClick(index);
        }

        cardEl.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${card.image}" alt="${card.title}" class="card-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="card-fallback" style="display:none;">${card.fallback}</div>
          </div>
          <div class="card-title">${card.title}</div>
        `;
        
        gridEl.appendChild(cardEl);
      });
    }

    function handleCardClick(index) {
      if (phase !== 'reorder') return;

      if (selectedIndex === null) {
        selectedIndex = index;
      } else if (selectedIndex === index) {
        selectedIndex = null;
      } else {
        // Меняем местами выбранные карточки
        const temp = currentCards[selectedIndex];
        currentCards[selectedIndex] = currentCards[index];
        currentCards[index] = temp;
        selectedIndex = null;
      }
      renderCards();
    }

    function finishGame() {
      clearInterval(timerInterval);
      phase = 'finished';

      let correctCount = 0;
      currentCards.forEach((card, index) => {
        if (card.id === originalOrderIds[index]) {
          correctCount++;
        }
      });

      document.getElementById('score-text').textContent = `${correctCount} / ${INITIAL_CARDS.length}`;
      
      let desc = '';
      if (correctCount === INITIAL_CARDS.length) {
        desc = 'Феноменальная память! Вы угадали абсолютно всё!';
      } else if (correctCount >= 5) {
        desc = 'Отличный результат! Почти идеально!';
      } else {
        desc = 'Хорошая попытка! Попробуйте еще раз!';
      }
      
      document.getElementById('result-desc').textContent = desc;
      modalEl.classList.add('show');
    }

    function resetGame() {
      init();
    }

    // Запуск при загрузке
    init();
  </script>
</body>
</html>
